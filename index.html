<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SimpleRecipes">
  <title>SimpleRecipes</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="index.html" class="brand">SimpleRecipes</a>
      <div class="topbar-actions">
        <div class="seg" role="group" aria-label="Motiv">
          <button type="button" data-theme-option="light" aria-label="Světlý motiv"></button>
          <button type="button" data-theme-option="dark" aria-label="Tmavý motiv"></button>
          <button type="button" data-theme-option="auto" aria-label="Podle zařízení"></button>
        </div>
        <button type="button" class="icon-btn" id="cartButton" aria-label="Nákupní seznam"><span data-icon="cart"></span><span class="badge" id="cartBadge" hidden>0</span></button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="toolbar">
      <label class="search">
        <span data-icon="search"></span>
        <input type="search" id="searchInput" placeholder="Hledat název, popis nebo štítek" autocomplete="off">
      </label>
      <div class="toolbar-actions">
        <button type="button" class="icon-btn" id="advancedToggle" data-icon="sliders" aria-label="Pokročilé filtry" aria-expanded="false" aria-controls="advancedPanel"></button>
        <div class="seg" role="group" aria-label="Zobrazení">
          <button type="button" data-view="list" data-icon="list" aria-label="Seznam"></button>
          <button type="button" data-view="grid" data-icon="grid" aria-label="Karty"></button>
        </div>
      </div>
    </div>

    <section class="advanced" id="advancedPanel" hidden>
      <div class="filter-group">
        <span class="filter-label">Kategorie</span>
        <div class="chips" id="tagChips"></div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Co mám doma</span>
        <div class="chips" id="pantryChips"></div>
      </div>
    </section>

    <div class="recipe-list grid" id="recipeList"></div>
    <p class="empty" id="emptyState" hidden>Žádný recept neodpovídá zadaným filtrům.</p>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a href="https://zurekmartin.cz">Martin Žůrek</a>
      <span>&middot;</span>
      <a href="https://github.com/zurekmartin/simplerecipes">GitHub</a>
    </div>
  </footer>

  <div class="modal" id="cartModal" hidden role="dialog" aria-modal="true" aria-labelledby="cartTitle">
    <div class="modal-backdrop" data-close></div>
    <aside class="modal-panel">
      <div class="modal-head">
        <h2 id="cartTitle">Nákupní seznam</h2>
        <button type="button" class="icon-btn" data-close data-icon="close" aria-label="Zavřít"></button>
      </div>
      <div class="modal-body" id="cartBody"></div>
      <div class="modal-foot">
        <button type="button" class="btn ghost" id="cartClear">Vyprázdnit</button>
        <button type="button" class="btn primary" data-close>Hotovo</button>
      </div>
    </aside>
  </div>

  <script src="assets/js/script.js"></script>
</body>
</html>
