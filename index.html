<!DOCTYPE html>
<html lang="cs" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1b1d1f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="description" content="Osobní sbírka jednoduchých receptů s přepočtem surovin podle počtu porcí a nákupním seznamem.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="author" content="Martin Žůrek">
  <link rel="canonical" href="https://recipes.zurekmartin.cz/">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/favicon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SimpleRecipes">
  <meta property="og:title" content="SimpleRecipes">
  <meta property="og:description" content="Osobní sbírka jednoduchých receptů s přepočtem surovin a nákupním seznamem.">
  <meta property="og:url" content="https://recipes.zurekmartin.cz/">
  <meta property="og:image" content="https://recipes.zurekmartin.cz/assets/img/favicon.png">
  <meta property="og:locale" content="cs_CZ">
  <meta name="twitter:card" content="summary">
  <title>SimpleRecipes · Recepty</title>
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"SimpleRecipes","url":"https://recipes.zurekmartin.cz/","inLanguage":"cs","author":{"@type":"Person","name":"Martin Žůrek","url":"https://www.zurekmartin.cz"}}</script>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/script.js" defer></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
    <symbol id="i-screen" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.8L21 8H6"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol>
  </svg>

  <header class="topbar">
    <div class="container topbar-inner">
      <a href="index.html" class="brand">SimpleRecipes</a>
      <div class="topbar-actions">
        <div class="seg" role="group" aria-label="Motiv">
          <button type="button" data-theme-option="light" aria-label="Světlý motiv"><svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg></button>
          <button type="button" data-theme-option="dark" aria-label="Tmavý motiv"><svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg></button>
          <button type="button" data-theme-option="auto" aria-label="Podle zařízení"><svg class="icon" aria-hidden="true"><use href="#i-screen"/></svg></button>
        </div>
        <button type="button" class="icon-btn" id="cartButton" aria-label="Nákupní seznam">
          <svg class="icon" aria-hidden="true"><use href="#i-cart"/></svg>
          <span class="badge" id="cartBadge" hidden>0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="page">
    <h1 class="visually-hidden">SimpleRecipes – recepty</h1>
    <div class="toolbar">
      <label class="search">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" id="searchInput" placeholder="Hledat název, popis nebo štítek" autocomplete="off">
      </label>
      <div class="toolbar-actions">
        <button type="button" class="icon-btn" id="advancedToggle" aria-label="Pokročilé filtry" aria-expanded="false" aria-controls="advancedPanel">
          <svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg>
        </button>
        <div class="seg" role="group" aria-label="Zobrazení">
          <button type="button" data-view="list" aria-label="Seznam"><svg class="icon" aria-hidden="true"><use href="#i-list"/></svg></button>
          <button type="button" data-view="grid" aria-label="Karty"><svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg></button>
        </div>
      </div>
    </div>

    <section class="advanced" id="advancedPanel" hidden>
      <div class="filter-group">
        <span class="filter-label">Kategorie</span>
        <div class="chips" id="tagChips"></div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Co mám doma</span>
        <div class="chips" id="pantryChips"></div>
      </div>
    </section>

    <div class="recipe-list grid" id="recipeList"></div>
    <p class="empty" id="emptyState" hidden>Žádný recept neodpovídá zadaným filtrům.</p>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a href="https://www.zurekmartin.cz">Martin Žůrek</a>
      <span aria-hidden="true">&middot;</span>
      <a href="https://github.com/ZurekMartin/SimpleRecipes">GitHub</a>
    </div>
  </footer>

  <dialog class="cart" id="cartModal" aria-labelledby="cartTitle">
    <header class="cart-head">
      <h2 id="cartTitle">Nákupní seznam</h2>
      <div class="cart-head-actions">
        <button type="button" class="icon-btn" id="cartShare" aria-label="Sdílet nákupní seznam" title="Sdílet nákupní seznam"><svg class="icon" aria-hidden="true"><use href="#i-share"/></svg></button>
        <button type="button" class="icon-btn" data-close aria-label="Zavřít"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
      </div>
    </header>
    <form class="cart-add" id="cartAddForm" autocomplete="off">
      <div class="search">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" id="cartAddInput" placeholder="Hledat nebo přidat položku" autocomplete="off">
        <button type="submit" class="step-btn" aria-label="Přidat položku"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
      </div>
    </form>
    <div class="cart-suggest" id="cartSuggest" hidden></div>
    <div class="cart-body" id="cartBody"></div>
    <footer class="cart-foot">
      <button type="button" class="btn ghost" id="cartClear">Vyprázdnit</button>
      <button type="button" class="btn primary" data-close>Hotovo</button>
    </footer>
  </dialog>
</body>
</html>
