<!DOCTYPE html>
<html lang="cs" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1b1d1f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="description" content="Detail receptu s přepočtem surovin podle počtu porcí a možností přidat suroviny do nákupního seznamu.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="author" content="Martin Žůrek">
  <link rel="canonical" href="https://recipes.zurekmartin.cz/recipe.html">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/favicon.png">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="SimpleRecipes">
  <meta property="og:title" content="SimpleRecipes">
  <meta property="og:description" content="Detail receptu s přepočtem surovin a nákupním seznamem.">
  <meta property="og:url" content="https://recipes.zurekmartin.cz/recipe.html">
  <meta property="og:image" content="https://recipes.zurekmartin.cz/assets/img/favicon.png">
  <meta property="og:locale" content="cs_CZ">
  <meta name="twitter:card" content="summary">
  <title>SimpleRecipes · Recept</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/script.js" defer></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
    <symbol id="i-screen" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.8L21 8H6"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-list-plus" viewBox="0 0 24 24"><path d="M4 6h10M4 12h10M4 18h6"/><path d="M18 14v6M15 17h6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  </svg>

  <header class="topbar">
    <div class="container topbar-inner">
      <a href="index.html" class="brand">SimpleRecipes</a>
      <div class="topbar-actions">
        <div class="seg" role="group" aria-label="Motiv">
          <button type="button" data-theme-option="light" aria-label="Světlý motiv"><svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg></button>
          <button type="button" data-theme-option="dark" aria-label="Tmavý motiv"><svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg></button>
          <button type="button" data-theme-option="auto" aria-label="Podle zařízení"><svg class="icon" aria-hidden="true"><use href="#i-screen"/></svg></button>
        </div>
        <button type="button" class="icon-btn" id="cartButton" aria-label="Nákupní seznam">
          <svg class="icon" aria-hidden="true"><use href="#i-cart"/></svg>
          <span class="badge" id="cartBadge" hidden>0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="page recipe-page">
    <div class="back-wrap">
      <a class="back-link" href="index.html"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg><span>Všechny recepty</span></a>
    </div>
    <article id="recipeArticle"></article>
    <div class="error-box" id="recipeError" hidden>
      <p>Recept se nepodařilo najít.</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a href="https://www.zurekmartin.cz">Martin Žůrek</a>
      <span aria-hidden="true">&middot;</span>
      <a href="https://github.com/ZurekMartin/SimpleRecipes">GitHub</a>
    </div>
  </footer>

  <dialog class="cart" id="cartModal" aria-labelledby="cartTitle">
    <header class="cart-head">
      <h2 id="cartTitle">Nákupní seznam</h2>
      <div class="cart-head-actions">
        <button type="button" class="icon-btn" id="cartShare" aria-label="Sdílet nákupní seznam" title="Sdílet nákupní seznam"><svg class="icon" aria-hidden="true"><use href="#i-share"/></svg></button>
        <button type="button" class="icon-btn" data-close aria-label="Zavřít"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
      </div>
    </header>
    <form class="cart-add" id="cartAddForm" autocomplete="off">
      <div class="search">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" id="cartAddInput" placeholder="Hledat nebo přidat položku" autocomplete="off">
        <button type="submit" class="step-btn" aria-label="Přidat položku"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
      </div>
    </form>
    <div class="cart-suggest" id="cartSuggest" hidden></div>
    <div class="cart-body" id="cartBody"></div>
    <footer class="cart-foot">
      <button type="button" class="btn ghost" id="cartClear">Vyprázdnit</button>
      <button type="button" class="btn primary" data-close>Hotovo</button>
    </footer>
  </dialog>
</body>
</html>
